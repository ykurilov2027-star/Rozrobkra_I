<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Детекція обʼєктів</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 48rem; margin: 3rem auto; padding: 0 1rem; }
    form { display: flex; gap: .5rem; align-items: center; margin: 1.5rem 0; flex-wrap: wrap; }
    button { padding: .5rem 1rem; font-size: 1rem; cursor: pointer; }
    #result { min-height: 3rem; white-space: pre-wrap; }
    .error { color: #b00020; }
    table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
    th, td { border: 1px solid #ddd; padding: .5rem; text-align: left; }
    th { background: #f4f4f4; }
  </style>
</head>
<body>
  <h1>Детекція обʼєктів</h1>

  <form id="detect-form">
    <input id="image" type="file" name="image" accept="image/*" required>
    <button type="submit">Знайти обʼєкти</button>
  </form>

  <div id="result"></div>

  <script>
    // Сторінка звертається до власного ендпоінта застосунку.
    // Як показувати знайдені обʼєкти — списком, таблицею, рамками поверх
    // зображення — на ваш розсуд.
    const form = document.getElementById('detect-form');
    const result = document.getElementById('result');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const file = document.getElementById('image').files[0];
      if (!file) return;

      const data = new FormData();
      data.append('image', file);

      result.className = '';
      result.textContent = 'Обробка…';

      try {
        const response = await fetch('/api/detect', { method: 'POST', body: data });
        const payload = await response.json();

        if (!response.ok) {
          result.className = 'error';
          result.textContent = 'Помилка: ' + JSON.stringify(payload);
          return;
        }

        const rows = payload.objects.map((item) => `
          <tr><td>${item.class}</td><td>${item.confidence}</td><td>[${item.box.join(', ')}]</td></tr>`
        ).join('');
        result.innerHTML = `<p>Обʼєктів: <strong>${payload.count}</strong>; inference: <strong>${payload.inference_time_ms} мс</strong></p>` +
          `<table><thead><tr><th>Клас</th><th>Confidence</th><th>Рамка [x1, y1, x2, y2]</th></tr></thead><tbody>${rows}</tbody></table>`;
      } catch (error) {
        result.className = 'error';
        result.textContent = 'Не вдалося звернутися до сервера.';
      }
    });
  </script>
</body>
</html>
